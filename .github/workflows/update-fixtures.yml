name: Update Fixtures

on:
  schedule:
    # Run every Saturday at 12 PM UTC
    - cron: "0 12 * * 6"
  workflow_dispatch: # Allow manual triggering

jobs:
  update-fixtures:
    name: Update OpenPowerlifting fixtures
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      OPENPOWERLIFTING_URL: "https://www.openpowerlifting.org"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3 sharp --ignore-scripts=false

      - name: Update fixtures from OpenPowerlifting
        run: npm run update:fixtures

      - name: Format updated fixtures
        run: npm run format

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: "chore: update OpenPowerlifting fixtures"
          title: "chore: update OpenPowerlifting fixtures"
          body: |
            Automated update of test fixtures from OpenPowerlifting.

            This PR was automatically created by the Update Fixtures workflow.
          branch: chore/update-fixtures
          delete-branch: true
          add-paths: |
            src/routes/api/**/fixtures/*

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
