name: Update Fixtures

on:
  schedule:
    # Run every Saturday at 12 PM UTC
    - cron: "0 12 * * 6"
  workflow_dispatch: # Allow manual triggering

jobs:
  update-fixtures:
    name: Update OpenPowerlifting fixtures
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    strategy:
      matrix:
        node-version: [25.x]

    env:
      OPENPOWERLIFTING_URL: "https://www.openpowerlifting.org"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update fixtures from OpenPowerlifting
        run: npm run update:fixtures

      - name: Format updated fixtures
        run: npm run format

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: "chore: update OpenPowerlifting fixtures"
          title: "chore: update OpenPowerlifting fixtures"
          body: |
            Automated update of test fixtures from OpenPowerlifting.

            This PR was automatically created by the Update Fixtures workflow.
          branch: chore/update-fixtures
          delete-branch: true
          add-paths: |
            src/routes/api/**/fixtures/*

      - name: Approve Pull Request
        if: steps.cpr.outputs.pull-request-number
        run: gh pr review --approve "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
