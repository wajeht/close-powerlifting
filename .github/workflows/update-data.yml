name: Update OPL Snapshot

# Re-parses OpenPowerlifting's nightly bulk CSV into our in-repo snapshot
# (src/data/snapshot/*.json) and opens an auto-merged PR with the result.
# Once merged, the next image build bakes the new data in — no in-container
# cron, no download at boot.

on:
  schedule:
    # Saturday 12:00 UTC. OPL publishes daily at midnight UTC; once a week
    # is plenty for a hobby deploy. Bump to `0 6 * * *` for daily.
    - cron: "0 12 * * 6"
  workflow_dispatch: # Allow manual triggering

jobs:
  update-snapshot:
    name: Rebuild OPL snapshot from upstream CSV
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          lfs: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build snapshot
        run: npx tsx scripts/build-snapshot.ts

      - name: Show snapshot size
        run: ls -lh src/data/snapshot/

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: "data: refresh OPL snapshot"
          title: "data: refresh OPL snapshot"
          body: |
            Automated weekly refresh of the OpenPowerlifting in-memory snapshot.

            Built by `scripts/build-snapshot.ts` from the upstream
            `openpowerlifting-latest.zip`. Counts and source `Last-Modified`
            land in `src/data/snapshot/meta.json`.
          branch: bot/update-opl-snapshot
          delete-branch: true
          add-paths: |
            src/data/snapshot/lifters.json
            src/data/snapshot/meets.json
            src/data/snapshot/entries.json
            src/data/snapshot/meta.json

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
