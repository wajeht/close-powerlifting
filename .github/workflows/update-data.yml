name: Update OPL Snapshot

# Re-parses OpenPowerlifting's nightly bulk CSV into our runtime snapshot
# and publishes it as assets on the `snapshot-latest` GitHub Release.
# The Dockerfile fetches these assets at image-build time, so the
# snapshot lives entirely outside the git history — no LFS, no quota
# pressure, no 700 MB blobs in the repo.

on:
  schedule:
    # Saturday 12:00 UTC. OPL publishes daily at midnight UTC; once a week
    # is plenty for a hobby deploy. Bump to `0 6 * * *` for daily.
    - cron: "0 12 * * 6"
  workflow_dispatch: # Allow manual triggering

jobs:
  publish-snapshot:
    name: Rebuild + publish OPL snapshot to GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build snapshot
        run: npx tsx scripts/build-snapshot.ts

      - name: Show snapshot size
        run: ls -lh src/data/snapshot/

      - name: Publish snapshot-latest release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          BUILT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/data/snapshot/meta.json','utf8')).builtAt)")

          # Replace the release atomically: delete the previous one (if
          # any) along with its tag, then recreate. Asset URLs stay stable
          # (always /releases/download/snapshot-latest/<file>) because the
          # tag name doesn't change.
          gh release delete snapshot-latest --yes --cleanup-tag 2>/dev/null || true

          gh release create snapshot-latest \
            --title "OPL snapshot ($BUILT)" \
            --notes "Automated rebuild from the OpenPowerlifting bulk CSV. See meta.json for counts." \
            src/data/snapshot/lifters.json \
            src/data/snapshot/meets.json \
            src/data/snapshot/entries.json \
            src/data/snapshot/runtime-indexes.json \
            src/data/snapshot/runtime-indexes.bin \
            src/data/snapshot/meta.json
