name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  APP_PORT: 80
  APP_ENV: "testing"
  APP_DOMAIN: "localhost"
  APP_PASSWORD_SALT: 10
  APP_JWT_SECRET: "test-jwt-secret"
  APP_ADMIN_EMAIL: "test@gmail.com"
  API_CALL_LOG_RETENTION_DAYS: 90

  SESSION_SECRET: "test-session-secret"
  SESSION_NAME: "close-powerlifting"
  SESSION_DOMAIN: "localhost"

  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_OAUTH_REDIRECT_URL: "http://localhost/oauth/google/redirect"

  OPENPOWERLIFTING_URL: "https://www.openpowerlifting.org"
  APP_API_KEY: ""

  EMAIL_HOST: "localhost"
  EMAIL_PORT: 1025
  EMAIL_SECURE: "false"
  EMAIL_USER: ""
  EMAIL_PASSWORD: ""
  EMAIL_FROM: "noreply@close-powerlifting.local"

jobs:
  format:
    name: Oxfmt format
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format codes
        run: npm run format:check

  lint:
    name: Oxlint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint codes
        run: npm run lint:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    services:
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test codes
        run: npm run test:ci

  build:
    needs: [format, test, lint]
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.image-name.outputs.TAG }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Generate Image Name
        id: image-name
        run: |
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URL=$(echo ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:$TAG | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image-name.outputs.IMAGE_URL }}

  deploy:
    needs: build
    name: Deploy
    uses: wajeht/doco-deploy-workflow/.github/workflows/deploy.yaml@main
    with:
      app-path: apps/close-powerlifting
      tag: ${{ needs.build.outputs.tag }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
