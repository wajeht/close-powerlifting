<nav class="hidden sm:block">
  <ul class="flex items-center gap-6">
    <!-- about -->
    <li>
      <a
        class="<%= typeof path !== 'undefined' && path === '/about' ? 'text-white' : 'text-neutral-400' %> inline-flex h-8 items-center transition-colors hover:text-white"
        href="/about"
        >About</a
      >
    </li>

    <!-- status (with health dot in the top-right corner) -->
    <li class="relative">
      <a
        class="<%= typeof path !== 'undefined' && path === '/status' ? 'text-white' : 'text-neutral-400' %> inline-flex h-8 items-center transition-colors hover:text-white"
        href="/status"
        >Status</a
      >
      <% if (state.routeHealth === true) { %>
      <span class="pointer-events-none absolute right-[-10px] top-[-1px] inline-flex h-1.5 w-1.5" aria-label="All systems operational" title="All systems operational">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-green-500 opacity-60"></span>
        <span class="relative inline-flex h-1.5 w-1.5 rounded-full bg-green-500"></span>
      </span>
      <% } else if (state.routeHealth === false) { %>
      <span class="pointer-events-none absolute right-[-10px] top-[-1px] inline-block h-1.5 w-1.5 rounded-full bg-power" aria-label="Service degraded" title="Service degraded"></span>
      <% } %>
    </li>

    <!-- docs -->
    <li>
      <a class="inline-flex h-8 items-center text-neutral-400 transition-colors hover:text-white" href="/docs/api" target="_blank"
        >Docs</a
      >
    </li>

    <!-- github (ghost button) -->
    <li>
      <a
        class="inline-flex h-8 items-center gap-2 rounded-md border border-neutral-700 px-3 text-neutral-300 transition-all hover:border-power hover:text-white"
        href="https://github.com/wajeht/close-powerlifting"
        target="_blank"
        rel="noopener"
        aria-label="GitHub"
      >
        <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.92.58.11.79-.25.79-.56 0-.27-.01-1.18-.02-2.14-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.97.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.06 11.06 0 0 1 5.78 0c2.21-1.49 3.18-1.18 3.18-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.7 5.41-5.27 5.69.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56C20.21 21.38 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z" />
        </svg>
        GitHub
      </a>
    </li>
  </ul>
</nav>
